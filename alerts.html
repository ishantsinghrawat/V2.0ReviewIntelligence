<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Voice Reports</title><link rel="stylesheet" href="assets/css/app.css"></head><body><header><div class="wrap brand"><h1>Customer Voice · Daily Reports</h1><a href="index.html" style="color:white">Dashboard</a></div></header><main class="wrap section"><div class="card"><h2>Report archive</h2><div id="list">Loading…</div></div></main><script>fetch('reports/index.json?v='+Date.now()).then(r=>r.json()).then(x=>{document.getElementById('list').innerHTML=x.length?x.map(f=>`<div class="review"><a href="reports/${encodeURIComponent(f)}">${f.replace('.html','')}</a></div>`).join(''):'No reports yet.'}).catch(()=>document.getElementById('list').textContent='No report index yet.');</script></body></html>
