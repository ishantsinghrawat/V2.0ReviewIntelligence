name: Customer Voice daily intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: write
  issues: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v

      - name: Run customer review pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          python scripts/pipeline.py

      - name: Build analytics
        run: |
          python scripts/analytics.py

      - name: Generate investigation brief
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          python scripts/agent_investigator.py

      - name: Generate daily report
        run: |
          python scripts/generate_report.py

      - name: Update reports index
        run: |
          python scripts/build_reports_index.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json data_1d.json data_master.json \
                  analytics_summary.json agent_brief.json \
                  delta_report.md reports/ || true

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Daily customer voice intelligence update"
            git push
          fi
